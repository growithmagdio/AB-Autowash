<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA8012" />
      <stop offset="85%" stop-color="#F1D27A" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest / Shield -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Border -->
    <path d="M50 5 L88 22 C88 65 50 88 50 95 C50 88 12 65 12 22 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Inner Accent Shield -->
    <path d="M50 12 L80 26 C80 60 50 78 50 85 C50 78 20 60 20 26 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2 2" />

    <!-- Crown on Top of Shield -->
    <path d="M34 26 L40 34 L50 24 L60 34 L66 26 L64 38 L36 38 Z" 
          fill="url(#goldGrad)" />
    <circle cx="34" cy="24" r="1.8" fill="#FFF8DC" />
    <circle cx="50" cy="21" r="2.2" fill="#FFF8DC" />
    <circle cx="66" cy="24" r="1.8" fill="#FFF8DC" />

    <!-- Monogram AB -->
    <text x="50" y="64" font-family="'Cinzel', serif, 'Times New Roman'" font-size="28" font-weight="900" 
          fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1" filter="url(#goldGlow)">AB</text>

    <!-- Wing / Ribbon Flourish under Shield -->
    <path d="M26 80 Q50 90 74 80 Q50 98 26 80 Z" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 22)">
    <!-- Main Title -->
    <text x="0" y="38" font-family="'Cinzel', 'Trajan Pro', serif" font-size="34" font-weight="800" 
          letter-spacing="5" fill="url(#goldGrad)" filter="url(#goldGlow)">AUTO BRIGHT</text>
    
    <!-- Luxury Sub-title -->
    <text x="2" y="60" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" 
          letter-spacing="6" fill="#F1D27A" opacity="0.95">CAR WASH &amp; DETAILING STUDIO</text>
    
    <!-- Location & Speciality Badge -->
    <text x="2" y="78" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" font-style="italic" 
          letter-spacing="2.5" fill="#E5C365">Ceramic Coating · PPF · Madurai</text>

    <!-- Royal divider line with diamond -->
    <line x1="0" y1="44" x2="350" y2="44" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
    <polygon points="175,41 179,44 175,47 171,44" fill="url(#goldGrad)" />
  </g>
</svg>
